name: Docker

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - .gitignore
      - .cursor/**
      - .docs/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Keep latest ordered when several commits land together.
concurrency:
  group: docker-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: image
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published image starts
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}
        run: |
          docker run -d --name animator-smoke -p 127.0.0.1:8080:80 "$IMAGE"
          trap 'docker logs animator-smoke; docker rm -fv animator-smoke' EXIT
          curl --fail --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:8080/
          docker restart --timeout 30 animator-smoke
          curl --fail --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:8080/

      - name: Publish latest after startup checks pass
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
